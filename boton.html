<div id="baHeaderMenuRoot"></div>

<script>
(function () {
  if (window.__BA_HEADER_MENU_V14__) return;
  window.__BA_HEADER_MENU_V14__ = true;

  /* =========================================================
     URLS
     ========================================================= */
  const BA_HOME_URL = "/";
  const BA_REGISTER_URL = "/registro/";
  const BA_CREATE_BARBERIA_URL = "/registro-barberias/";
  const BA_PROFILE_URL = "/perfil/";
  const BA_PLANS_URL = "/planes/";
  const BA_DASHBOARD_URL = "/barberia";
  const BA_SESSION_ME_URL = "/api/session/me";
  const BA_SESSION_LOGOUT_URL = "/api/session/logout";
  const BA_DELETE_ENDPOINT_BASE = "/api/barberias";

  /* =========================================================
     LOCAL CACHE KEYS
     ========================================================= */
  const SESSION_KEYS = [
    "ba_google_token",
    "ba_user_id",
    "ba_user_email",
    "ba_user_nombre",
    "ba_user_apellido",
    "ba_user_nombre_manual",
    "ba_user_apellido_manual",
    "ba_puede_crear_barberia",
    "ba_barberia_state",
    "ba_subscription_state",
    "ba_days_remaining",
    "ba_billing_term",
    "ba_plan_code",
    "ba_plan_name",
    "ba_period_start",
    "ba_period_end",
    "ba_barberias",
    "ba_barberias_count",
    "ba_current_barberia"
  ];

  let stateBlockedNotice = null;
  let activeDeleteModal = null;

  /* =========================================================
     HELPERS
     ========================================================= */
  function clean(v) {
    return (v ?? "").toString().trim();
  }

  function esc(v) {
    return clean(v)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function prettify(v) {
    const x = clean(v).replace(/[_\-.]+/g, " ").replace(/\s+/g, " ").trim();
    if (!x) return "";
    return x
      .split(" ")
      .map((w) => w ? (w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()) : "")
      .join(" ")
      .trim();
  }

  function isHandleLike(v) {
    const x = clean(v);
    if (!x) return false;
    if (x.includes("@")) return true;
    return x.indexOf(" ") === -1 && /[_\-.]/.test(x);
  }

  function emailToName(email) {
    const base = clean(email).includes("@") ? clean(email).split("@")[0] : "Usuario";
    return prettify(base) || "Usuario";
  }

  function isLoggedInLocal() {
    return !!clean(localStorage.getItem("ba_user_id")) && !!clean(localStorage.getItem("ba_user_email"));
  }

  function setOrRemove(key, value) {
    if (value === null || value === undefined || value === "") {
      localStorage.removeItem(key);
      return;
    }
    localStorage.setItem(key, String(value));
  }

  function isBarberiaActivePlan(b) {
    const sub = clean(b?.subscription_state).toUpperCase();
    return ["PAID_ACTIVE", "TRIAL_ACTIVE", "TRIAL_EXPIRING", "ACTIVATION_PENDING"].includes(sub);
  }

  function isBarberiaOwner(b) {
    const r = clean(b?.role).toLowerCase();
    return !r || r === "owner";
  }

  /* =========================================================
     PRODUCT STATE
     ========================================================= */
  function getCanonicalState(data) {
    const ps = data && typeof data.product_state === "object" ? data.product_state : {};
    return {
      barberiaState: clean(data?.barberia_state) || clean(ps?.barberia_state),
      subscriptionState: clean(data?.subscription_state) || clean(ps?.subscription_state),
      daysRemaining: data?.days_remaining ?? ps?.days_remaining ?? null,
      billingTerm: clean(data?.billing_term) || clean(ps?.billing_term),
      planCode: clean(data?.plan_code) || clean(ps?.plan_code),
      planName: clean(data?.plan_name) || clean(ps?.plan_name),
      periodStart: clean(data?.period_start) || clean(ps?.period_start),
      periodEnd: clean(data?.period_end) || clean(ps?.period_end)
    };
  }

  function setLocalFromSession(data) {
    const manualNombre = prettify(localStorage.getItem("ba_user_nombre_manual"));
    const manualApellido = prettify(localStorage.getItem("ba_user_apellido_manual"));
    const savedNombre = prettify(localStorage.getItem("ba_user_nombre"));
    const savedApellido = prettify(localStorage.getItem("ba_user_apellido"));
    const backendNombre = prettify(data.nombre);
    const backendApellido = prettify(data.apellido);
    const email = clean(data.email) || clean(localStorage.getItem("ba_user_email"));

    let nombre = manualNombre || savedNombre;
    let apellido = manualApellido || savedApellido;

    if ((!nombre || isHandleLike(nombre)) && backendNombre && !isHandleLike(backendNombre)) {
      nombre = backendNombre;
    }
    if ((!apellido || isHandleLike(apellido)) && backendApellido && !isHandleLike(backendApellido)) {
      apellido = backendApellido;
    }
    if (!nombre || isHandleLike(nombre)) {
      nombre = emailToName(email);
    }

    localStorage.setItem("ba_user_id", String(data.user_id || ""));
    localStorage.setItem("ba_user_email", email);
    localStorage.setItem("ba_user_nombre", nombre);
    localStorage.setItem("ba_user_apellido", apellido);
    localStorage.setItem("ba_puede_crear_barberia", String(!!data.puede_crear_barberia));

    if (manualNombre) localStorage.setItem("ba_user_nombre_manual", manualNombre);
    if (manualApellido) localStorage.setItem("ba_user_apellido_manual", manualApellido);

    const state = getCanonicalState(data);
    setOrRemove("ba_barberia_state", state.barberiaState);
    setOrRemove("ba_subscription_state", state.subscriptionState);
    setOrRemove("ba_days_remaining", state.daysRemaining);
    setOrRemove("ba_billing_term", state.billingTerm);
    setOrRemove("ba_plan_code", state.planCode);
    setOrRemove("ba_plan_name", state.planName);
    setOrRemove("ba_period_start", state.periodStart);
    setOrRemove("ba_period_end", state.periodEnd);

    const barberias = Array.isArray(data.barberias) ? data.barberias : [];
    const count = Number(data.barberias_count ?? barberias.length ?? 0);

    localStorage.setItem("ba_barberias_count", String(count));
    localStorage.setItem("ba_barberias", JSON.stringify(barberias));

    if (data.current_barberia) {
      localStorage.setItem("ba_current_barberia", JSON.stringify(data.current_barberia));
    } else {
      localStorage.removeItem("ba_current_barberia");
    }
  }

  function clearSession() {
    SESSION_KEYS.forEach((k) => localStorage.removeItem(k));
    if (window.google && google.accounts && google.accounts.id) {
      try { google.accounts.id.disableAutoSelect(); } catch (_) {}
    }
  }

  async function syncSessionFromBackend() {
    try {
      const r = await fetch(BA_SESSION_ME_URL, {
        method: "GET",
        credentials: "include",
        cache: "no-store",
        headers: { Accept: "application/json" }
      });
      const raw = await r.text();
      let data = {};
      try { data = raw ? JSON.parse(raw) : {}; } catch (_) {}

      if (r.ok && data.ok) {
        setLocalFromSession(data);
        return true;
      }
      if (r.status === 401) {
        clearSession();
        return false;
      }
      return isLoggedInLocal();
    } catch (_) {
      return isLoggedInLocal();
    }
  }

  function getUser() {
    const manualNombre = prettify(localStorage.getItem("ba_user_nombre_manual"));
    const manualApellido = prettify(localStorage.getItem("ba_user_apellido_manual"));
    let nombre = manualNombre || prettify(localStorage.getItem("ba_user_nombre"));
    let apellido = manualApellido || prettify(localStorage.getItem("ba_user_apellido"));
    const email = clean(localStorage.getItem("ba_user_email"));

    if (!nombre || isHandleLike(nombre)) {
      nombre = emailToName(email);
    }
    const full = [nombre, apellido].filter(Boolean).join(" ").trim();
    const first = full ? full.split(/\s+/)[0] : "Usuario";

    return { first, full: full || "Usuario", email };
  }

  function getBarberiasState() {
    let barberias = [];
    let current = null;
    try { barberias = JSON.parse(localStorage.getItem("ba_barberias") || "[]"); } catch (_) {}
    try { current = JSON.parse(localStorage.getItem("ba_current_barberia") || "null"); } catch (_) {}

    const count = Number(localStorage.getItem("ba_barberias_count") || barberias.length || 0);
    const barberiaState = clean(localStorage.getItem("ba_barberia_state")) || (count <= 0 ? "none" : count === 1 ? "single" : "multiple");

    return {
      count,
      barberiaState,
      barberias: Array.isArray(barberias) ? barberias : [],
      current
    };
  }

  function translateTerm(term) {
    const map = {
      monthly: "Mensual",
      quarterly: "Trimestral",
      semiannual: "Semestral",
      annual: "Anual"
    };
    return map[clean(term)] || "";
  }

  function formatDate(value) {
    if (!value) return "";
    const d = new Date(value);
    if (Number.isNaN(d.getTime())) return "";
    return d.toLocaleDateString("es-CO", { day: "numeric", month: "short", year: "numeric" });
  }

  function getBarberiaPresentation(barberia) {
    const state = clean(barberia?.subscription_state);
    const term = translateTerm(barberia?.billing_term);
    const rawDays = barberia?.days_remaining;
    const hasDays = rawDays !== null && rawDays !== undefined && rawDays !== "" && Number.isFinite(Number(rawDays));
    const days = hasDays ? Math.max(0, Number(rawDays)) : null;
    const end = formatDate(barberia?.period_end);

    if (state === "PAID_ACTIVE") {
      if (days !== null && days > 0 && days <= 5) {
        return {
          label: days === 1 ? "Vence mañana" : `Vence en ${days} días`,
          cls: "is-warning",
          detail: [term || "Plan activo", end ? `válido hasta ${end}` : ""].filter(Boolean).join(" · ")
        };
      }
      return {
        label: term ? `${term} · Activo` : "Plan activo",
        cls: "is-active",
        detail: end ? `Válido hasta ${end}` : "Plan activo"
      };
    }

    if (state === "TRIAL_ACTIVE") {
      return {
        label: days !== null ? (days === 1 ? "Prueba · 1 día" : `Prueba · ${days} días`) : "Prueba activa",
        cls: "is-trial",
        detail: end ? `Prueba válida hasta ${end}` : "Prueba gratis activa"
      };
    }

    if (state === "TRIAL_EXPIRING") {
      return {
        label: days === 1 ? "Vence mañana" : (days !== null ? `Vence en ${days} días` : "Prueba por vencer"),
        cls: "is-warning",
        detail: end ? `Prueba válida hasta ${end}` : "Tu prueba está por vencer"
      };
    }

    if (state === "TRIAL_EXPIRED") {
      return {
        label: "Cancelada",
        cls: "is-expired",
        detail: "Prueba gratis finalizada"
      };
    }

    if (state === "ACTIVATION_PENDING") {
      return {
        label: "Activando...",
        cls: "is-warning",
        detail: "Estamos activando tu plan"
      };
    }

    return {
      label: "Pendiente",
      cls: "is-pending",
      detail: "Estado no disponible"
    };
  }

  function getProductPresentation() {
    const state = getBarberiasState();

    if (state.barberiaState === "multiple" || state.count > 1) {
      const current = state.current;
      const currentFromList = current ? state.barberias.find((b) => Number(b.id) === Number(current.id)) : null;
      const enriched = currentFromList || current;
      const product = enriched ? getBarberiaPresentation(enriched) : null;

      return {
        mode: "multiple",
        label: "Barbería actual",
        status: `${state.count} en tu cuenta`,
        name: enriched ? (enriched.nombre || enriched.name || enriched.slug || "Barbería seleccionada") : "Selecciona una barbería",
        substatus: product ? product.label : "",
        substatusClass: product ? product.cls : "is-pending",
        detail: product ? product.detail : "",
        cls: "is-active"
      };
    }

    if (state.barberiaState === "none" || state.count <= 0) {
      return {
        mode: "zero",
        label: "Comienza gratis",
        status: "7 días",
        name: "Crea tu barbería",
        substatus: "",
        detail: "Configura tu barbería y activa tu prueba gratis.",
        cls: "is-pending"
      };
    }

    const single = state.barberias[0] || state.current;
    if (single) {
      const product = getBarberiaPresentation(single);
      return {
        mode: "single",
        label: "Plan actual",
        status: product.label,
        name: single.nombre || single.name || single.slug || "Mi barbería",
        substatus: "",
        detail: product.detail,
        cls: product.cls
      };
    }

    return {
      mode: "unknown",
      label: "Tu barbería",
      status: "Disponible",
      name: "Ir a mi panel",
      substatus: "",
      detail: "",
      cls: "is-active"
    };
  }

  function dashboardUrl(barberia) {
    const slug = clean(barberia && barberia.slug);
    const id = Number(barberia && barberia.id);
    const url = new URL(BA_DASHBOARD_URL, window.location.origin);
    if (id > 0) url.searchParams.set("barberia_id", String(id));
    if (slug) url.searchParams.set("slug", slug);
    return url.toString();
  }

  function renderProductBlock() {
    const p = getProductPresentation();

    return `
      <div class="ba5-plan-box">
        <div class="ba5-plan-top">
          <span class="ba5-plan-label">${esc(p.label)}</span>
          <span class="ba5-plan-pill ${p.cls}">${esc(p.status)}</span>
        </div>
        <div class="ba5-plan-name">${esc(p.name)}</div>
        ${p.mode === "multiple" && p.substatus ? `
          <div class="ba-current-product">
            <span class="ba-current-product-label">Estado</span>
            <span class="ba-barberia-status ${esc(p.substatusClass)}">${esc(p.substatus)}</span>
          </div>
        ` : ""}
        ${p.detail ? `<div class="ba-plan-validity">${esc(p.detail)}</div>` : ""}
      </div>
    `;
  }

  function renderBarberiasBlock() {
    const state = getBarberiasState();

    if (state.count <= 0) {
      return `<a class="ba5-user-item" href="${BA_CREATE_BARBERIA_URL}">Crear mi barbería</a>`;
    }

    if (state.count === 1) {
      return "";
    }

    const currentId = Number(state.current && state.current.id);
    const items = state.barberias.slice(0, 20).map((b) => {
      const id = Number(b.id);
      const name = esc(b.nombre || b.name || b.slug || "Barbería");
      const currentClass = currentId && id === currentId ? " is-current" : "";
      const product = getBarberiaPresentation(b);
      const isOwner = isBarberiaOwner(b);
      const isActivePlan = isBarberiaActivePlan(b);

      return `
        <div class="ba5-barberia-card${currentClass}">
          <a class="ba5-barberia-link" href="${dashboardUrl(b)}" title="Abrir panel de ${name}">
            <div class="ba-barberia-row">
              <div class="ba-barberia-row-top">
                <span class="ba-barberia-name">${name}</span>
                <span class="ba-barberia-status ${product.cls}">${esc(product.label)}</span>
              </div>
              <span class="ba-barberia-detail">${esc(product.detail)}</span>
            </div>
          </a>
          ${isOwner ? `
            <button
              type="button"
              class="ba-barberia-delete-btn ${isActivePlan ? 'is-active-blocked' : 'is-eligible'}"
              data-id="${id}"
              data-name="${name}"
              data-active="${isActivePlan ? 'true' : 'false'}"
              title="${isActivePlan ? 'No puedes eliminar esta barbería mientras tenga un plan activo. Cancela primero el plan.' : 'Eliminar barbería'}"
              aria-label="${isActivePlan ? `No puedes eliminar ${name}: plan activo` : `Eliminar barbería ${name}`}"
            >
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/>
              </svg>
              <span>Eliminar</span>
            </button>
          ` : ""}
        </div>
      `;
    }).join("");

    return `
      <div class="ba5-plan-box">
        <div class="ba5-plan-top">
          <span class="ba5-plan-label">Mis barberías</span>
          <span class="ba5-plan-pill is-active">${state.count}</span>
        </div>
        ${stateBlockedNotice ? `
          <div class="ba-blocked-notice-banner" role="alert">
            <span>${esc(stateBlockedNotice)}</span>
            <button type="button" onclick="window.__baCloseBlockedNotice && window.__baCloseBlockedNotice()" aria-label="Cerrar aviso">×</button>
          </div>
        ` : ""}
        <div class="ba5-barberias-list">
          ${items}
        </div>
        <a class="ba5-user-item" href="${BA_CREATE_BARBERIA_URL}">Crear otra barbería</a>
      </div>
    `;
  }

  function renderContextualPrimaryAction() {
    const state = getBarberiasState();
    if (state.count <= 0) {
      return `<a class="ba5-user-item" href="${BA_CREATE_BARBERIA_URL}">Crear mi barbería</a>`;
    }

    let current = state.current;
    if (current) {
      current = state.barberias.find((b) => Number(b.id) === Number(current.id)) || current;
    }
    if (!current && state.barberias.length === 1) {
      current = state.barberias[0];
    }
    if (!current) return "";

    const subscription = clean(current.subscription_state);

    if (subscription === "TRIAL_ACTIVE" || subscription === "TRIAL_EXPIRING") {
      return `<a class="ba5-user-item" href="${BA_PLANS_URL}">Elegir plan</a>`;
    }
    if (subscription === "TRIAL_EXPIRED") {
      return `<a class="ba5-user-item" href="${BA_PLANS_URL}">Reactivar barbería</a>`;
    }
    if (subscription === "ACTIVATION_PENDING") {
      return `<a class="ba5-user-item" href="${dashboardUrl(current)}">Revisar activación</a>`;
    }
    return `<a class="ba5-user-item" href="${dashboardUrl(current)}">Ir a mi panel</a>`;
  }

  /* =========================================================
     DELETE CONFIRMATION MODAL LOGIC
     ========================================================= */
  function openDeleteModal(barberiaId, barberiaName) {
    closeDeleteModal();

    const overlay = document.createElement("div");
    overlay.className = "ba-delete-modal-overlay";
    overlay.setAttribute("role", "presentation");

    overlay.innerHTML = `
      <div class="ba-delete-modal-dialog" role="alertdialog" aria-modal="true" aria-labelledby="baDeleteModalTitle">
        <div class="ba-delete-modal-header">
          <div class="ba-delete-modal-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
              <line x1="12" y1="9" x2="12" y2="13"/>
              <line x1="12" y1="17" x2="12.01" y2="17"/>
            </svg>
          </div>
          <h3 id="baDeleteModalTitle" class="ba-delete-modal-title">¿Eliminar "${esc(barberiaName)}"?</h3>
        </div>

        <div class="ba-delete-modal-body">
          <p>Esta barbería dejará de aparecer en tu cuenta y quedará deshabilitada para nuevas reservas.</p>
          <p>El historial de citas, pagos y datos contables se conservará.</p>
        </div>

        <div>
          <label class="ba-delete-modal-label" for="baConfirmNameInput">
            Escribe: <strong>${esc(barberiaName)}</strong>
          </label>
          <input
            id="baConfirmNameInput"
            type="text"
            class="ba-delete-modal-input"
            placeholder="${esc(barberiaName)}"
            autocomplete="off"
          />
        </div>

        <p id="baDeleteModalError" class="ba-delete-modal-error" style="display:none;"></p>

        <div class="ba-delete-modal-actions">
          <button type="button" id="baDeleteModalCancel" class="ba-delete-modal-cancel">Cancelar</button>
          <button type="button" id="baDeleteModalConfirm" class="ba-delete-modal-confirm" disabled>
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
            </svg>
            <span>Eliminar barbería</span>
          </button>
        </div>
      </div>
    `;

    document.body.appendChild(overlay);
    activeDeleteModal = overlay;

    const input = overlay.querySelector("#baConfirmNameInput");
    const confirmBtn = overlay.querySelector("#baDeleteModalConfirm");
    const cancelBtn = overlay.querySelector("#baDeleteModalCancel");
    const errorP = overlay.querySelector("#baDeleteModalError");

    input.focus();

    input.addEventListener("input", function () {
      const match = input.value.trim() === barberiaName.trim();
      confirmBtn.disabled = !match;
    });

    cancelBtn.addEventListener("click", function () {
      closeDeleteModal();
    });

    overlay.addEventListener("click", function (e) {
      if (e.target === overlay) {
        closeDeleteModal();
      }
    });

    confirmBtn.addEventListener("click", async function () {
      if (input.value.trim() !== barberiaName.trim()) return;

      confirmBtn.disabled = true;
      confirmBtn.querySelector("span").textContent = "Eliminando...";
      errorP.style.display = "none";

      try {
        const deleteUrl = `${BA_DELETE_ENDPOINT_BASE}/${barberiaId}/delete`;
        const res = await fetch(deleteUrl, {
          method: "POST",
          credentials: "include",
          headers: {
            "Content-Type": "application/json",
            "Accept": "application/json"
          }
        });

        const data = await res.json().catch(() => ({}));

        if (res.ok && data.ok) {
          // Remove from local storage
          const state = getBarberiasState();
          const remaining = state.barberias.filter((b) => Number(b.id) !== Number(barberiaId));
          localStorage.setItem("ba_barberias", JSON.stringify(remaining));
          localStorage.setItem("ba_barberias_count", String(remaining.length));

          if (state.current && Number(state.current.id) === Number(barberiaId)) {
            const nextCurrent = remaining[0] || null;
            if (nextCurrent) {
              localStorage.setItem("ba_current_barberia", JSON.stringify(nextCurrent));
            } else {
              localStorage.removeItem("ba_current_barberia");
            }
          }

          closeDeleteModal();
          stateBlockedNotice = null;
          renderHeaderMenu();

          // Also trigger background session sync
          syncSessionFromBackend().then(() => renderHeaderMenu()).catch(() => {});
        } else {
          confirmBtn.disabled = false;
          confirmBtn.querySelector("span").textContent = "Eliminar barbería";

          const isSessionExpired =
            res.status === 401 ||
            data.error === "not_authenticated" ||
            data.code === "session_expired" ||
            data.code === "sesion_expirada" ||
            (typeof data.message === "string" && data.message.toLowerCase().includes("sesi"));

          if (isSessionExpired) {
            errorP.textContent = "Tu sesión expiró. Inicia sesión nuevamente para continuar.";
          } else {
            errorP.textContent = data.message || "Error al eliminar la barbería.";
          }
          errorP.style.display = "block";
        }
      } catch (err) {
        confirmBtn.disabled = false;
        confirmBtn.querySelector("span").textContent = "Eliminar barbería";
        errorP.textContent = "Error de conexión. Intenta nuevamente.";
        errorP.style.display = "block";
      }
    });
  }

  function closeDeleteModal() {
    if (activeDeleteModal && activeDeleteModal.parentNode) {
      activeDeleteModal.parentNode.removeChild(activeDeleteModal);
    }
    activeDeleteModal = null;
  }

  window.__baCloseBlockedNotice = function () {
    stateBlockedNotice = null;
    renderHeaderMenu(true);
  };

  /* =========================================================
     MENU EVENTS
     ========================================================= */
  function bindMenuEvents(menu) {
    const btn = menu.querySelector(".ba5-user-btn-menu");
    const logout = menu.querySelector("#ba5LogoutBtn");

    if (btn) {
      btn.addEventListener("click", function (e) {
        e.stopPropagation();
        const open = menu.classList.toggle("is-open");
        btn.setAttribute("aria-expanded", open ? "true" : "false");
      });
    }

    if (logout) {
      logout.addEventListener("click", async function () {
        try {
          await fetch(BA_SESSION_LOGOUT_URL, {
            method: "POST",
            credentials: "include"
          });
        } catch (_) {}
        clearSession();
        window.location.href = BA_HOME_URL;
      });
    }

    // Delete buttons event delegation
    const deleteBtns = menu.querySelectorAll(".ba-barberia-delete-btn");
    deleteBtns.forEach((delBtn) => {
      delBtn.addEventListener("click", function (e) {
        e.preventDefault();
        e.stopPropagation();

        const id = Number(delBtn.getAttribute("data-id"));
        const name = delBtn.getAttribute("data-name");
        const isActive = delBtn.getAttribute("data-active") === "true";

        if (isActive) {
          stateBlockedNotice = "No puedes eliminar esta barbería mientras tenga un plan activo. Cancela primero el plan.";
          renderHeaderMenu(true);
        } else {
          stateBlockedNotice = null;
          openDeleteModal(id, name);
        }
      });
    });

    document.addEventListener("click", function (e) {
      if (!menu.contains(e.target)) {
        menu.classList.remove("is-open");
        if (btn) btn.setAttribute("aria-expanded", "false");
      }
    });

    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape") {
        if (activeDeleteModal) {
          closeDeleteModal();
        } else {
          menu.classList.remove("is-open");
          if (btn) btn.setAttribute("aria-expanded", "false");
        }
      }
    });
  }

  /* =========================================================
     MAIN RENDER
     ========================================================= */
  function renderHeaderMenu(preserveOpen) {
    const root = document.getElementById("baHeaderMenuRoot");
    if (!root) return false;

    if (!isLoggedInLocal()) {
      root.innerHTML = `<a class="ba5-user-btn" href="${BA_REGISTER_URL}">Regístrate</a>`;
      return true;
    }

    const wasOpen = preserveOpen !== undefined ? Boolean(preserveOpen) : Boolean(document.querySelector("#ba5UserMenu.is-open"));
    const u = getUser();

    root.innerHTML = `
      <div class="ba5-user-menu ${wasOpen ? "is-open" : ""}" id="ba5UserMenu">
        <button
          type="button"
          class="ba5-user-btn ba5-user-btn-menu"
          aria-expanded="${wasOpen ? "true" : "false"}"
        >
          Hola, ${esc(u.first)}
        </button>

        <div class="ba5-user-dropdown">
          <div class="ba5-user-head">
            <div class="ba5-user-name">${esc(u.full || u.first)}</div>
            <div class="ba5-user-email">${esc(u.email)}</div>
          </div>

          ${renderProductBlock()}

          ${renderBarberiasBlock()}

          ${renderContextualPrimaryAction()}

          <a class="ba5-user-item" href="${BA_PROFILE_URL}">Mi perfil</a>

          <button
            type="button"
            id="ba5LogoutBtn"
            class="ba5-user-item ba5-user-logout"
          >
            Cerrar sesión
          </button>
        </div>
      </div>
    `;

    const menu = document.getElementById("ba5UserMenu");
    if (menu) {
      bindMenuEvents(menu);
    }

    return true;
  }

  /* =========================================================
     INIT
     ========================================================= */
  async function init() {
    await syncSessionFromBackend();
    if (renderHeaderMenu()) return;

    let tries = 0;
    const t = setInterval(function () {
      if (renderHeaderMenu() || ++tries > 20) {
        clearInterval(t);
      }
    }, 300);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }

  window.addEventListener("storage", renderHeaderMenu);
  window.baRefreshUserMenu = async function () {
    await syncSessionFromBackend();
    renderHeaderMenu();
  };
})();
</script>
